server.port=8080

# Application Name
spring.application.name=bfarm-backend

# Database Configuration (MySQL with env var overrides)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bfarm_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Constraints (Max 5MB per requirement)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# AI Microservice URL
ai.service.url=${AI_SERVICE_URL:http://localhost:8000/predict}

# JWT Configuration (HMAC-SHA256 >= 256 bits)
app.jwt.secret=${JWT_SECRET:BFarmSuperSecretAgriculturalTokensKeyForFarmersAndAdmins2026Secure!}
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Static Resources for Admin Dashboard
spring.web.resources.static-locations=classpath:/static/
